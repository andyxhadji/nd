[project]
name = "nd"
version = "1.0.0"
description = "Autonomous AgentField agents for MR comment processing"
requires-python = ">=3.11"
dependencies = [
    "agentfield>=0.1.0",
    "claude-agent-sdk>=0.2.87",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "functional: Functional integration tests",
    "local: Local-only tests that require external services and are skipped by default",
    "unit: Unit tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["nd"]
