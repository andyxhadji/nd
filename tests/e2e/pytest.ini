[pytest]
# E2E test configuration
markers =
    e2e: End-to-end tests requiring docker-compose
    slow: Slow tests (>10 seconds)
    skip_ci: Skip in CI (for local-only tests)

asyncio_mode = auto

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals

# Timeout for async tests
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if needed)
# Run with: pytest --cov=nd tests/e2e/
