version: '3.8'

services:
  agentfield:
    image: agentfield/control-plane:latest
    ports:
      - "8081:8080"
    volumes:
      - agentfield-data:/data
    environment:
      - DATABASE_URL=sqlite:///data/agentfield.db
      - LOG_LEVEL=info

  triage:
    build: .
    command: python -m nd.triage
    environment:
      - AGENTFIELD_URL=http://agentfield:8080
      - MIDDLEMAN_URL=http://host.docker.internal:8091
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - TRIAGE_MODEL=${TRIAGE_MODEL:-bedrock/converse/arn:aws:bedrock:us-east-1:657062785455:application-inference-profile/fa9v3zo70aog}
      - ND_CURRENT_USER=${ND_CURRENT_USER}
    depends_on:
      - agentfield
    restart: unless-stopped

  worker-1:
    build: .
    command: python -m nd.worker
    environment:
      - AGENTFIELD_URL=http://agentfield:8080
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - WORKER_MODEL=${WORKER_MODEL:-bedrock/converse/arn:aws:bedrock:us-east-1:657062785455:application-inference-profile/fa9v3zo70aog}
      - AGENT_INSTANCE_ID=worker-1
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - KATA_SERVER=${KATA_SERVER:-}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-70}
      - ROBOREV_MAX_ITERATIONS=${ROBOREV_MAX_ITERATIONS:-3}
    depends_on:
      - agentfield
    restart: unless-stopped

  worker-2:
    build: .
    command: python -m nd.worker
    environment:
      - AGENTFIELD_URL=http://agentfield:8080
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - WORKER_MODEL=${WORKER_MODEL:-bedrock/converse/arn:aws:bedrock:us-east-1:657062785455:application-inference-profile/fa9v3zo70aog}
      - AGENT_INSTANCE_ID=worker-2
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - KATA_SERVER=${KATA_SERVER:-}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-70}
      - ROBOREV_MAX_ITERATIONS=${ROBOREV_MAX_ITERATIONS:-3}
    depends_on:
      - agentfield
    restart: unless-stopped

volumes:
  agentfield-data:
