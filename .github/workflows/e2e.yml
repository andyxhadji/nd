name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Use fast, cheap models for E2E tests
  TRIAGE_MODEL: openrouter/google/gemini-2.0-flash-exp:free
  WORKER_MODEL: openrouter/google/gemini-2.0-flash-exp:free

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create .env.local for E2E tests
        run: |
          cat > .env.local <<EOF
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          ND_CURRENT_USER=test-user
          ND_ASSIGNED_USERNAMES=test-user,reviewer
          EOF

      - name: Start E2E environment
        run: |
          docker compose -f tests/e2e/docker compose.e2e.yml up -d

      - name: Wait for services
        run: |
          chmod +x tests/e2e/scripts/wait-for-services.sh
          tests/e2e/scripts/wait-for-services.sh

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v --tb=short --e2e-timeout=300
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "Collecting docker compose logs..."
          docker compose -f tests/e2e/docker compose.e2e.yml logs --tail=500 > e2e-logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs.txt
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/e2e/docker compose.e2e.yml down -v

  e2e-summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: e2e
    if: always()

    steps:
      - name: Check E2E result
        run: |
          if [ "${{ needs.e2e.result }}" == "success" ]; then
            echo "✅ E2E tests passed!"
          else
            echo "❌ E2E tests failed!"
            exit 1
          fi
